name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create Structure
        run: flutter create --platforms=android --org com.egyptfootball.app .
      - name: Fix Manifest
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/><application/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="الكرة المصرية"/g' android/app/src/main/AndroidManifest.xml
      - name: Enable Desugaring
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          if kts.exists():
              s = kts.read_text()
              s = re.sub(r"(compileOptions\s*\{)", r"\1\n        isCoreLibraryDesugaringEnabled = true", s, count=1)
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              kts.write_text(s)
          elif groovy.exists():
              s = groovy.read_text()
              s = re.sub(r"(compileOptions\s*\{)", r"\1\n        coreLibraryDesugaringEnabled true", s, count=1)
              s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              groovy.write_text(s)
          else:
              raise SystemExit("android/app/build.gradle not found")
          PY
      - name: Get Dependencies
        run: flutter pub get
      - name: Generate App Icon
        run: |
          pip install pillow
          mkdir -p assets
          python3 - <<'PY'
          import math
          from PIL import Image, ImageDraw

          def ball(d, cx, cy, r):
              d.ellipse([cx-r, cy-r, cx+r, cy+r], fill="white", outline="#38BDF8", width=int(r*0.05))
              pr = r * 0.38
              pts = []
              for i in range(5):
                  a = math.radians(-90 + 72 * i)
                  pts.append((cx + pr*math.cos(a), cy + pr*math.sin(a)))
              d.polygon(pts, fill="#0F172A")
              for i in range(5):
                  a = math.radians(-90 + 72 * i)
                  x1, y1 = cx + pr*math.cos(a), cy + pr*math.sin(a)
                  x2, y2 = cx + r*0.82*math.cos(a), cy + r*0.82*math.sin(a)
                  d.line([x1, y1, x2, y2], fill="#0F172A", width=int(r*0.05))
                  b = a + math.radians(36)
                  px, py = cx + r*0.80*math.cos(b), cy + r*0.80*math.sin(b)
                  d.ellipse([px-r*0.12, py-r*0.12, px+r*0.12, py+r*0.12], fill="#0F172A")

          S = 1024
          icon = Image.new("RGB", (S, S), "#0F172A")
          ball(ImageDraw.Draw(icon), S/2, S/2, 380)
          icon.save("assets/icon.png")

          fg = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ball(ImageDraw.Draw(fg), S/2, S/2, 290)
          fg.save("assets/icon_fg.png")
          PY
      - name: Apply App Icon
        run: dart run flutter_launcher_icons
      - name: Build APK
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/*.apk
